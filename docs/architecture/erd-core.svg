<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .tbl-hdr { font-size: 13px; font-weight: bold; fill: #ffffff; }
      .fld-name { font-size: 11px; fill: #1e293b; }
      .fld-type { font-size: 10px; fill: #64748b; font-family: monospace; }
      .badge-pk { font-size: 9px; font-weight: bold; fill: #854d0e; }
      .badge-fk { font-size: 9px; font-weight: bold; fill: #1e40af; }
      .badge-uq { font-size: 9px; font-weight: bold; fill: #6b21a8; }
      .line-rel { stroke: #475569; stroke-width: 1.5; fill: none; }
      .crow-text { font-size: 11px; font-weight: bold; fill: #334155; }
      .enum-title { font-size: 12px; font-weight: bold; fill: #ffffff; }
      .enum-item { font-size: 10.5px; fill: #334155; font-family: monospace; }
    </style>
    <!-- Arrow marker -->
    <marker id="circle-end" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" class="title">Hi-CRM Database Entity-Relationship Diagram (ERD)</text>
  <text x="600" y="64" text-anchor="middle" class="subtitle">Core Architecture · Model Relational Schema (backend/prisma/schema.prisma)</text>

  <!-- ═══════════════ RELATION LINES (Back Layer) ═══════════════ -->
  <!-- User (1) to Contact (N) -->
  <path d="M 280 180 L 440 180" class="line-rel" />
  <text x="290" y="174" class="crow-text">1</text>
  <text x="425" y="174" class="crow-text">N</text>

  <!-- User (1) to PosBillingDraft (N) -->
  <path d="M 200 310 L 200 490 L 440 490" class="line-rel" />
  <text x="206" y="325" class="crow-text">1</text>
  <text x="425" y="484" class="crow-text">N</text>

  <!-- Contact (1) to Conversation (N) -->
  <path d="M 700 180 L 820 180" class="line-rel" />
  <text x="710" y="174" class="crow-text">1</text>
  <text x="805" y="174" class="crow-text">N</text>

  <!-- Conversation (1) to Message (N) -->
  <path d="M 940 310 L 940 370" class="line-rel" />
  <text x="946" y="325" class="crow-text">1</text>
  <text x="946" y="362" class="crow-text">N</text>

  <!-- Contact (1) to PosBillingDraft (N) -->
  <path d="M 570 340 L 570 430" class="line-rel" />
  <text x="576" y="355" class="crow-text">1</text>
  <text x="576" y="422" class="crow-text">N</text>

  <!-- PermissionGroup (1) to User (N) -->
  <path d="M 165 370 L 165 310" class="line-rel" />
  <text x="172" y="362" class="crow-text">1</text>
  <text x="172" y="325" class="crow-text">N</text>

  <!-- User (1) to ZaloAccount (N) -->
  <path d="M 120 310 L 120 530" class="line-rel" />
  <text x="126" y="325" class="crow-text">1</text>
  <text x="126" y="522" class="crow-text">N</text>

  <!-- ZaloAccount (1) to ZaloAccountAccess (N) -->
  <path d="M 270 590 L 330 590" class="line-rel" />
  <text x="278" y="584" class="crow-text">1</text>
  <text x="315" y="584" class="crow-text">N</text>

  <!-- Message (N) to User (1) (repliedBy) -->
  <path d="M 820 440 L 750 440 L 750 250 L 280 250" class="line-rel" stroke-dasharray="4,3" />
  <text x="805" y="434" class="crow-text">N</text>
  <text x="290" y="244" class="crow-text">1</text>

  <!-- ═══════════════ TABLE 1: User ═══════════════ -->
  <g transform="translate(50, 90)">
