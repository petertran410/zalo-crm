    <!-- Rows -->
    <rect x="5" y="34" width="22" height="15" rx="3" fill="#fef9c3" stroke="#fde047" stroke-width="0.8"/><text x="10" y="45" class="badge-pk">PK</text>
    <text x="34" y="46" class="fld-name">id</text><text x="222" y="46" text-anchor="end" class="fld-type">String/UUID</text>
    
    <rect x="5" y="56" width="22" height="15" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/><text x="10" y="67" class="badge-fk">FK</text>
    <text x="34" y="68" class="fld-name">permissionGroupId</text><text x="222" y="68" text-anchor="end" class="fld-type">String?</text>
    
    <text x="34" y="90" class="fld-name">fullName</text><text x="222" y="90" text-anchor="end" class="fld-type">String</text>
    
    <rect x="5" y="100" width="22" height="15" rx="3" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="0.8"/><text x="10" y="111" class="badge-uq">UQ</text>
    <text x="34" y="112" class="fld-name">email</text><text x="222" y="112" text-anchor="end" class="fld-type">String?</text>
    
    <rect x="5" y="122" width="22" height="15" rx="3" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="0.8"/><text x="10" y="133" class="badge-uq">UQ</text>
    <text x="34" y="134" class="fld-name">phone</text><text x="222" y="134" text-anchor="end" class="fld-type">String?</text>
    
    <text x="34" y="156" class="fld-name">role</text><text x="222" y="156" text-anchor="end" class="fld-type">String</text>
