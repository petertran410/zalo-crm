<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" width="1050" height="620" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .tbl-hdr { font-size: 13px; font-weight: bold; fill: #ffffff; }
      .fld-name { font-size: 11px; fill: #1e293b; }
      .fld-type { font-size: 10px; fill: #64748b; font-family: monospace; }
      .badge-pk { font-size: 9px; font-weight: bold; fill: #854d0e; }
      .badge-fk { font-size: 9px; font-weight: bold; fill: #1e40af; }
      .badge-uq { font-size: 9px; font-weight: bold; fill: #6b21a8; }
      .line-rel { stroke: #475569; stroke-width: 1.5; fill: none; }
      .crow-text { font-size: 11px; font-weight: bold; fill: #334155; }
    </style>
  </defs>

  <text x="525" y="40" text-anchor="middle" class="title">Sub-domain 1: Multi-tenant RBAC &amp; Organization Hierarchy</text>
  <text x="525" y="62" text-anchor="middle" class="subtitle">Organization, Team, Department, User, PermissionGroup &amp; ZaloAccountAccess</text>

  <!-- Relations -->
  <!-- Org -> Team -->
  <path d="M 330 140 L 420 140" class="line-rel" />
  <text x="340" y="134" class="crow-text">1</text><text x="405" y="134" class="crow-text">N</text>

  <!-- Org -> Department -->
  <path d="M 250 250 L 250 330 L 420 330" class="line-rel" />
  <text x="256" y="265" class="crow-text">1</text><text x="405" y="324" class="crow-text">N</text>

  <!-- Team -> User -->
  <path d="M 640 140 L 730 140" class="line-rel" />
  <text x="650" y="134" class="crow-text">1</text><text x="715" y="134" class="crow-text">N</text>

  <!-- PermGroup -> User -->
  <path d="M 640 460 L 830 460 L 830 330" class="line-rel" />
  <text x="650" y="454" class="crow-text">1</text><text x="836" y="345" class="crow-text">N</text>

  <!-- User -> ZaloAccountAccess -->
  <path d="M 830 330 L 830 430" class="line-rel" />
  <text x="836" y="355" class="crow-text">1</text><text x="836" y="420" class="crow-text">N</text>

  <!-- Org Table -->
  
    <g transform="translate(80, 90)">
