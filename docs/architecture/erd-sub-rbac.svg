      <text x="34" y="46" class="fld-name">id</text>
      <text x="210" y="46" text-anchor="end" class="fld-type">String/UUID</text>
    
      <rect x="5" y="56" width="22" height="15" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/><text x="10" y="67" class="badge-fk">FK</text>
      <text x="34" y="68" class="fld-name">orgId</text>
