      <rect width="250" height="6" y="22" fill="#1e3a8a"/>
      <text x="125" y="19" text-anchor="middle" class="tbl-hdr">Organization</text>
      
      <rect x="5" y="34" width="22" height="15" rx="3" fill="#fef9c3" stroke="#fde047" stroke-width="0.8"/><text x="10" y="45" class="badge-pk">PK</text>
      <text x="34" y="46" class="fld-name">id</text>
      <text x="240" y="46" text-anchor="end" class="fld-type">String/UUID</text>
    
      
      <text x="34" y="68" class="fld-name">name</text>
      <text x="240" y="68" text-anchor="end" class="fld-type">String</text>
    
      
      <text x="34" y="90" class="fld-name">timezone</text>
      <text x="240" y="90" text-anchor="end" class="fld-type">String</text>
    
      
      <text x="34" y="112" class="fld-name">logoUrl</text>
      <text x="240" y="112" text-anchor="end" class="fld-type">String?</text>
    
      
      <text x="34" y="134" class="fld-name">emailDomain</text>
      <text x="240" y="134" text-anchor="end" class="fld-type">String?</text>
    
      
      <text x="34" y="156" class="fld-name">fbPullEnabled</text>
      <text x="240" y="156" text-anchor="end" class="fld-type">Boolean</text>
    
      
      <text x="34" y="178" class="fld-name">createdAt</text>
      <text x="240" y="178" text-anchor="end" class="fld-type">DateTime</text>
    
      
      <text x="34" y="200" class="fld-name">updatedAt</text>
