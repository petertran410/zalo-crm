  <text x="575" y="40" text-anchor="middle" class="title">Sub-domain 2: Customer 360 &amp; Delegated Zalo Care</text>
  <text x="575" y="62" text-anchor="middle" class="subtitle">Two-ledger model (Contact KH Cha &amp; Friend Thẻ con), Conversation, Message &amp; Care Follow-ups</text>

  <!-- Relations -->
  <!-- Contact (1) -> Friend (N) -->
  <path d="M 320 180 L 440 180" class="line-rel" />
  <text x="330" y="174" class="crow-text">1</text><text x="425" y="174" class="crow-text">N</text>

  <!-- ZaloAccount (1) -> Friend (N) -->
  <path d="M 560 380 L 560 330" class="line-rel" />
  <text x="566" y="375" class="crow-text">1</text><text x="566" y="345" class="crow-text">N</text>

  <!-- Contact (1) -> Conversation (N) -->
  <path d="M 190 330 L 190 440 L 440 440" class="line-rel" />
  <text x="196" y="345" class="crow-text">1</text><text x="425" y="434" class="crow-text">N</text>

  <!-- Conversation (1) -> Message (N) -->
