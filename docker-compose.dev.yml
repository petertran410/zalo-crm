version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Development overlay — docker compose -f docker-compose.yml -f docker-compose.dev.yml
# Overrides `app` to run tsx watch (hot-reload backend) and adds `frontend`
# service running Vite dev server (HMR). Source dirs are bind-mounted from host;
# node_modules stay inside the container (anonymous volume) to avoid OS mismatch.
#
# IMPORTANT (Windows): Docker on Windows/WSL2 does NOT forward filesystem inotify
# events into containers. All watchers MUST use polling mode (CHOKIDAR_USEPOLLING).
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: zalo-crm-app-dev
    restart: on-failure
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx nodemon -L --watch src -e ts --exec tsx src/app.ts"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER:-crmuser}:${DB_PASSWORD}@db:5432/${DB_NAME:-zalocrm}
      # Polling cho tsx watch trên Windows Docker (inotify không hoạt động)
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
      # Tắt Prisma query log mặc định (bật khi cần debug: PRISMA_LOG_QUERIES=true)
      - PRISMA_LOG_QUERIES=false
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - file_storage:/var/lib/zalo-crm/files
    ports:
      - "${APP_PORT:-3080}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # minio: đã chuyển sang profile 'storage-s3' (2026-07-24) — không còn là dependency
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      # Backend cần ~60-90s: prisma generate (~10s) + db push (~10s) + app boot (~20s)
      # + Zalo reconnect (~20s). 120s grace để không bị đánh unhealthy sớm.
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev-frontend
    container_name: zalo-crm-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - IS_DOCKER=true
      # Polling cho Vite/chokidar trên Windows Docker
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      app:
        condition: service_healthy
