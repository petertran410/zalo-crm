version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: zalo-crm-app-dev
    command: sh -c "npx prisma generate && npx prisma db push && npx tsx watch src/app.ts"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER:-crmuser}:${DB_PASSWORD}@db:5432/${DB_NAME:-zalocrm}
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - file_storage:/var/lib/zalo-crm/files
    ports:
      - "${APP_PORT:-3080}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev-frontend
    container_name: zalo-crm-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - IS_DOCKER=true
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - app
