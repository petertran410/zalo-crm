version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: zalo-crm-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3080}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-crmuser}:${DB_PASSWORD}@db:5432/${DB_NAME:-zalocrm}
      # STORAGE 2026-06-20: storage config (STORAGE_DRIVER, S3_*, LOCAL_PUBLIC_URL,
      # APP_URL) đến từ env_file .env — KHÔNG override ở đây nữa để keys R2 không bị
      # ghi đè bằng MINIO_ROOT_*. Mặc định STORAGE_DRIVER=local (lưu vào volume bên dưới).
      # Phase 7 overnight test: STUB mode prevents Zalo SDK calls.
      # Set to 'false' or remove for REAL mode.
      - AUTOMATION_STUB_MODE=${AUTOMATION_STUB_MODE:-false}
      # Friend Invite Queue test mode: 60s tick delay instead of 20-40min.
      - FRIEND_INVITE_TEST_MODE=${FRIEND_INVITE_TEST_MODE:-true}
      # ── Luồng Mục Tiêu M1 (2026-06-01) ── BullMQ Redis URL
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # ── Antivirus (ClamAV service đã gỡ khỏi stack, 2026-07-25) ── mặc định TẮT.
      # scanBuffer() fail-open: không có clamav thì trả 'skipped', không chặn upload.
      - MEDIA_AV_ENABLED=${MEDIA_AV_ENABLED:-0}
      - MEDIA_AV_FAIL_CLOSED=${MEDIA_AV_FAIL_CLOSED:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # minio: đã chuyển sang profile 'storage-s3' (2026-07-24) — không còn là dependency
      # cứng. Bật lại: docker compose --profile storage-s3 up -d minio minio-init
    volumes:
      - file_storage:/var/lib/zalo-crm/files
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # FIX 2026-06-08: log driver json-file CŨ bị đóng băng (docker logs kẹt 1 mốc, không
    # stream log mới) → không debug được worker. Giới hạn + rotate để tránh corrupt/đầy.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    container_name: zalo-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-crmuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-zalocrm}
      # TZ giờ VN cho OS container + log. Storage vẫn UTC (xem -c timezone bên dưới).
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crmuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ── Timezone (Cách 2 — giờ VN cho ops/log, 2026-06-14) ──────────────────────
    #   log_timezone=Asia/Ho_Chi_Minh → log Postgres hiện giờ VN, dễ đối chiếu UI.
    #   timezone=UTC (GIỮ NGUYÊN)     → CURRENT_TIMESTAMP / @default(now()) lưu UTC.
    #   ĐỪNG đổi timezone sang Asia/Ho_Chi_Minh: Prisma đọc cột timestamp như UTC
    #   → toàn bộ mốc thời gian sẽ lệch +7h (xem notes/claude-memory timezone).
    #
    # ── POSTGRES SCALING GUIDE ───────────────────────────────────────────────────
    # Điều chỉnh 3 tham số bên dưới theo quy mô server. Quy tắc chung:
    #   shared_buffers     = 25% RAM server dành cho Postgres (không vượt 8GB).
    #   effective_cache_size = 50-75% tổng RAM server.
    #   max_connections    = (số sale đồng thời × 2) + 10 dự phòng (tools/backup).
    #                        Prisma pool mặc định: DATABASE_URL?connection_limit=10
    #
    # ┌─────────────────────────┬────────────────┬─────────────────┬────────────────┐
    # │ Quy mô hệ thống         │ shared_buffers │ eff_cache_size  │ max_connections│
    # ├─────────────────────────┼────────────────┼─────────────────┼────────────────┤
    # │ Hiện tại (≤20 sale,     │     64MB  ←    │     128MB  ←    │     25  ←      │
    # │  server dùng chung)     │                │                 │                │
    # ├─────────────────────────┼────────────────┼─────────────────┼────────────────┤
    # │ Server riêng 4GB RAM,   │    512MB       │      1GB        │     50         │
    # │ 20-50 sale              │                │                 │                │
    # ├─────────────────────────┼────────────────┼─────────────────┼────────────────┤
    # │ Server riêng 8GB RAM,   │      1GB       │      4GB        │    100         │
    # │ 50-100 sale             │                │                 │                │
    # ├─────────────────────────┼────────────────┼─────────────────┼────────────────┤
    # │ Dedicated DB 16GB+      │      4GB       │      8GB        │    200         │
    # │ 100+ sale               │ (dùng PgBouncer│                 │ (bắt buộc      │
    # │                         │  connection    │                 │  PgBouncer)    │
    # │                         │  pooler)       │                 │                │
    # └─────────────────────────┴────────────────┴─────────────────┴────────────────┘
    #
    # ⚠️  Khi tăng max_connections > 100: cân nhắc dùng PgBouncer (connection pooler)
    #     thay vì tăng trực tiếp — mỗi connection tốn ~5-10MB RAM Postgres.
    # ⚠️  Sau khi sửa: docker compose restart db (KHÔNG cần xóa volume — data an toàn).
    # ─────────────────────────────────────────────────────────────────────────────
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c max_connections=25
      -c timezone=UTC
      -c log_timezone=Asia/Ho_Chi_Minh

  redis:
    image: redis:7-alpine
    container_name: zalo-crm-redis
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh # log Redis giờ VN (Cách 2); Redis không lưu thời gian nghiệp vụ
    # ── Luồng Mục Tiêu M1 (2026-06-01) ──
    # AOF every 1s (Issue #5 5A — crash recovery survive: BullMQ jobs delayed/waiting
    # persist even if container kill -9). Verified POC spike 5/5 PASS 2026-06-01.
    # maxmemory 256MB cho 35K jobs cumulative (memory scale_target: 5K KH/day × 7 days).
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # profiles: redis  ← REMOVED M1 2026-06-01: Redis là dependency cứng của BullMQ

  # ── MinIO (S3-compatible local object storage) ────────────────────────────
  # TẮT MẶC ĐỊNH (2026-07-24): STORAGE_DRIVER=local → file lưu thẳng ra ổ đĩa
  # qua local-driver.ts, MinIO không được dùng. Container vẫn chạy tốn ~200-400MB
  # RAM vô ích. Chuyển sang profile 'storage-s3'.
  #
  # ĐỂ BẬT LẠI KHI CẦN (chuyển sang MinIO hoặc S3-compatible):
  #   1. Đổi STORAGE_DRIVER=r2 + điền S3_* trong .env
  #   2. docker compose --profile storage-s3 up -d minio minio-init
  minio:
    profiles: ["storage-s3"]   # ← KHÔNG start khi `docker compose up` bình thường
    image: minio/minio:latest
    container_name: zalo-crm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    profiles: ["storage-s3"]   # ← KHÔNG start khi `docker compose up` bình thường
    image: minio/mc:latest
    container_name: zalo-crm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${S3_BUCKET:-zalocrm-attachments};
      mc anonymous set download local/${S3_BUCKET:-zalocrm-attachments};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER:     "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}"
      S3_BUCKET: ${S3_BUCKET:-zalocrm-attachments}

  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: zalo-crm-backup
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    environment:
      # TZ giờ VN → SCHEDULE '@daily' chạy 00:00 giờ VN (trước đây UTC = 07:00 sáng VN);
      # tên file backup cũng theo giờ VN. Dữ liệu dump vẫn là UTC y như DB lưu.
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-zalocrm}
      POSTGRES_USER: ${DB_USER:-crmuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
    depends_on:
      - db

volumes:
  pg_data:
  file_storage:
  redis_data:
  minio_data:
