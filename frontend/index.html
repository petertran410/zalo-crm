<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/brand/zalocrm.ico" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/zalocrm-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/brand/zalocrm-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- App là light-only (theme hsLight). Khai báo để Chrome Android "Auto dark theme"
         KHÔNG tự ép tối → tránh ô input bị trắng + chữ nhập vô hình trên mobile. -->
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#0A192F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Typography chung: Montserrat cho heading, Roboto Medium cho body.
         Dashboard và Nhắn tin giữ font hiện tại; số/mã tiếp tục dùng Roboto Mono. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ZaloCRM</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
